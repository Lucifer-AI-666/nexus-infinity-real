services:
  nexus-api:
    build: .
    container_name: nexus-infinity-real
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_DEBUG: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./nexus_memory:/app/nexus_memory
      - ./nexus_approvals:/app/nexus_approvals
      - ./nexus_logs:/app/nexus_logs
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/status', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
